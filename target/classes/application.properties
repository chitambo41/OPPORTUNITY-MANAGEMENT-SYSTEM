# ===========================================================
# Opportunity Nursery School - main configuration (MySQL 8)
# ===========================================================
spring.application.name=opportunity-school

# --- Datasource (MySQL). Override with env vars DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opportunity_school}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate (dialect auto-detected from the JDBC URL: MySQL in prod, H2 in tests) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Server ---
server.port=8081
server.error.include-message=always
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET:OpportunityNurserySchoolSuperSecretKeyForJwtSigning2026ChangeMeInProduction0123456789}
app.jwt.expiration-ms=86400000
app.public-url=${APP_PUBLIC_URL:http://localhost:8081}
app.mail.from=${MAIL_FROM:no-reply@opportunity-school.local}

app.seed.enabled=true

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=warn
