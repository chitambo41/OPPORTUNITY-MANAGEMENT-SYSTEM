# Test profile: in-memory H2 in MySQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:opportunity_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR,CURRENT
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false
app.jwt.secret=TestSecretKeyForOpportunitySchoolJwtSigningMustBeLongEnough1234567890
app.jwt.expiration-ms=3600000
